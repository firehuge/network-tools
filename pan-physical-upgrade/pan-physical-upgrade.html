<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PAN Physical Upgrade Planner</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Offline browser tool: plan a Palo Alto Networks firewall refresh from a tech-support file and convert the config to the new model or VM-Series. Nothing is uploaded.">
<meta name="color-scheme" content="light dark">
<style>
/* SPDX-License-Identifier: Apache-2.0 */
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#5c6b7a;--bd:#d8dee4;--g:#1f9d55;--y:#d89b00;--r:#d64545;--b:#2f6fd6;--gb:#e7f6ee;--yb:#fff6dc;--rb:#fdeaea;--ib:#e8f0fe;--i:#2f6fd6}
.dark{--bg:#12161c;--card:#1b222b;--tx:#e6edf3;--mu:#97a4b1;--bd:#2c3642;--gb:#15301f;--yb:#332a0d;--rb:#3a1a1a;--ib:#1a2740}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,Segoe UI,Arial;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header h1{font-size:22px;margin:0;flex:1}
button,select,input,label.btn{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.primary{background:var(--b);color:#fff;border-color:var(--b)}
button:disabled{opacity:.5;cursor:not-allowed}
main{max-width:1400px;margin:auto;padding:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:18px}
#drop{border:3px dashed var(--b);text-align:center;padding:40px;font-size:20px;cursor:pointer}
#drop.over{background:var(--gb)}
#drop.small{padding:16px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.f{padding:10px 12px;border-radius:8px;background:var(--bg)}
.f b{display:block;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.f span{font-size:17px;word-break:break-word;overflow-wrap:anywhere}
.nf{color:var(--mu);font-style:italic}
.status{font-size:20px;font-weight:600;padding:10px 14px;border-radius:8px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.s-g{background:var(--gb);color:var(--g)}.s-y{background:var(--yb);color:var(--y)}.s-r{background:var(--rb);color:var(--r)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.pill{font-size:14px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.pill.r{background:var(--rb);color:var(--r);border-color:var(--r)}
.pill.y{background:var(--yb);color:var(--y);border-color:var(--y)}
.pill.i{background:var(--ib);color:var(--i);border-color:var(--b)}
.issue{border-left:6px solid;border-radius:8px;padding:12px 14px;margin:10px 0;background:var(--bg)}
.issue.critical{border-color:var(--r)}.issue.warning{border-color:var(--y)}.issue.info{border-color:var(--b)}
.issue h3{margin:0 0 4px;font-size:18px}
.tip{color:var(--mu)}
.cnt{float:right;font-size:13px;color:var(--mu)}
.ev{font:12px/1.4 Consolas,monospace;color:var(--mu);margin-top:6px}
.ev a{color:var(--b);cursor:pointer;text-decoration:underline;display:block;margin:2px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{padding:8px 16px}
.tabs button.on{background:var(--b);color:#fff;border-color:var(--b)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.ctl input[type=text],.ctl input[type=search]{flex:1;min-width:180px}
.ctl input[type=datetime-local]{min-width:190px}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th,table.data td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}
table.data th{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
table.data tr.drop td{background:var(--rb)}
table.data tr.warn td{background:var(--yb)}
#prow{max-width:720px;margin:12px auto 0;text-align:center}
.progress{height:10px;background:var(--bd);border-radius:99px;overflow:hidden;margin:0 auto;max-width:520px}
.progress>div{height:100%;width:0;background:var(--b);transition:width .15s}
#btn-cancel{margin:8px 0 0;padding:6px 14px;border-radius:8px;border:1px solid var(--b,#2563eb);background:#fff;color:var(--b,#2563eb);cursor:pointer;font:inherit}
#btn-cancel:hover{background:var(--gb,#eff6ff)}
#ptext{margin-top:8px;font-size:13px;word-break:break-word}
.muted{color:var(--mu);font-size:14px}
h2{margin:0 0 12px;font-size:20px}
h3{margin:14px 0 8px;font-size:17px}
.pill.g{background:var(--gb);color:var(--g);border-color:var(--g)}
.pills.left{margin-left:0}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.rec{border:2px solid var(--bd);border-radius:12px;padding:14px;background:var(--bg)}
.rec.best{border-color:var(--g)}
.rec.sel{outline:3px solid var(--b);outline-offset:2px}
.rec h3{margin:0 0 6px;font-size:20px}
.rec ul{margin:6px 0 0 18px;padding:0}
.rec .why{color:var(--mu);font-size:14px}
table.data td.num,table.data th.num{text-align:right;font-variant-numeric:tabular-nums}
table.data td.ok{color:var(--g);font-weight:600}
table.data td.short{color:var(--r);font-weight:600}
table.data td.unk{color:var(--mu);font-style:italic}
table.data select{padding:4px 6px;font-size:14px;max-width:100%}
table.data tr.unmapped td{background:var(--yb)}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;min-width:80px}
.bar>div{height:100%;background:var(--g)}
.bar.y>div{background:var(--y)}.bar.r>div{background:var(--r)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 16px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mu)}
.form label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--tx)}
.form input[type=text],.form input[type=number],.form select{width:100%}
.note{border-left:5px solid var(--b);background:var(--ib);padding:8px 12px;border-radius:6px;margin:8px 0;font-size:15px}
.note.y{border-color:var(--y);background:var(--yb)}
.note.r{border-color:var(--r);background:var(--rb)}
.note.g{border-color:var(--g);background:var(--gb)}
.mono{font:13px/1.4 Consolas,monospace;word-break:break-all}
.scroll{max-height:520px;overflow:auto;border:1px solid var(--bd);border-radius:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.src{font-size:12px;color:var(--mu)}
.redact{filter:blur(0)}
details.box{border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin:8px 0;background:var(--bg)}
details.box>summary{cursor:pointer;font-weight:600}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:8px 0}
.mode{display:flex;flex-direction:column;gap:4px;border:2px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer}
.mode.on{border-color:var(--b);background:var(--ib)}
.mode span{font-size:14px;color:var(--mu)}
td.num input,td input[type=number]{padding:4px 6px}
#catbadge{margin-left:auto}
@media print{
  :root,.dark{--bg:#fff;--card:#fff;--tx:#000;--mu:#444;--bd:#bbb;--gb:#e7f6ee;--yb:#fff6dc;--rb:#fdeaea;--ib:#e8f0fe}
  header,#drop,.tabs,.actions,.noprint{display:none!important}
  body{background:#fff!important;color:#000!important}
  .card{break-inside:avoid;border-color:#bbb}
  .tabpanel:not(#tab-report){display:none!important}
  #tab-report{display:block!important}
}

.ci{border-top:1px solid var(--bd);padding:8px 0}.ci:first-of-type{border-top:0}.ci p{margin:4px 0}

</style>
</head>
<body>
<header>
  <h1>🔁 PAN Physical Upgrade Planner</h1>
  <span class="tip">Files stay on this computer. Nothing is uploaded.</span>
  <span id="catbadge" class="pill" title="Where the model and end-of-life data came from">Catalog: bundled</span>
  <label class="btn" title="Load a newer catalog JSON file"><input type="file" id="catfile" accept=".json" hidden>📥 Catalog file</label>
  <button id="btn-theme" type="button" aria-label="Switch light or dark mode">🌓 Dark</button>
</header>
<main>
  <div id="drop" class="card">📂 Drop a Palo Alto tech-support file here (.tgz, .tar.gz, .zip)<br>
    <small>or click to browse. A running-config.xml also works (conversion only, no sizing data).</small>
    <input id="fi" type="file" hidden accept=".tgz,.tar,.gz,.tar.gz,.zip,.xml,.txt">
  </div>
  <div id="prow" hidden>
    <div id="pbar" class="progress"><div></div></div>
    <button type="button" id="btn-cancel">Cancel</button>
    <div id="ptext" class="muted"></div>
  </div>
  <div id="err" class="card s-r" hidden></div>

  <div id="out" hidden>
    <nav class="tabs" aria-label="Steps">
      <button type="button" class="on" data-tab="current">1. Current device</button>
      <button type="button" data-tab="target">2. Pick the new firewall</button>
      <button type="button" data-tab="hardware">3. Hardware &amp; cabling</button>
      <button type="button" data-tab="lic">4. Licenses</button>
      <button type="button" data-tab="convert">5. Convert config</button>
      <button type="button" data-tab="readiness">6. Readiness checks</button>
      <button type="button" data-tab="report">7. Report for finance / sales</button>
    </nav>
    <div id="tab-current" class="tabpanel"></div>
    <div id="tab-target" class="tabpanel" hidden></div>
    <div id="tab-hardware" class="tabpanel" hidden></div>
    <div id="tab-lic" class="tabpanel" hidden></div>
    <div id="tab-convert" class="tabpanel" hidden></div>
    <div id="tab-readiness" class="tabpanel" hidden></div>
    <div id="tab-report" class="tabpanel" hidden></div>
  </div>
</main>
<!-- Native browser APIs only (DecompressionStream, DOMParser). No third-party code, no CDN. -->
<script>
/* SPDX-License-Identifier: Apache-2.0 */
/* PAN Physical Upgrade planner: pure logic (no DOM rendering).
   Runs in the browser and in Node tests. XML parsing goes through an adapter so Node
   can use @xmldom/xmldom and the browser uses the native DOMParser. */
(function (root) {
"use strict";
const PPU = {};

/* ============================ small helpers ============================ */
const NBSP = /\u00a0/g;
function clean(s) { return String(s == null ? "" : s).replace(NBSP, " ").replace(/\r/g, ""); }
function toInt(s) { if (s == null) return null; const m = String(s).replace(/,/g, "").match(/-?\d+(?:\.\d+)?/); return m ? Math.round(parseFloat(m[0])) : null; }
function pct(a, b) { return (a != null && b) ? (100 * a / b) : null; }
function fmtNum(n) { if (n == null || isNaN(n)) return "—"; return Math.round(n).toLocaleString("en-US"); }
function fmtBps(bps) {
  if (bps == null || isNaN(bps)) return "—";
  if (bps >= 1e12) return (bps / 1e12).toFixed(2).replace(/\.?0+$/, "") + " Tbps";
  if (bps >= 1e9) return (bps / 1e9).toFixed(2).replace(/\.?0+$/, "") + " Gbps";
  if (bps >= 1e6) return (bps / 1e6).toFixed(1).replace(/\.0$/, "") + " Mbps";
  if (bps >= 1e3) return (bps / 1e3).toFixed(1).replace(/\.0$/, "") + " kbps";
  return Math.round(bps) + " bps";

function fmtSpeed(mbps) { if (!mbps) return "—"; return mbps >= 1000 ? (mbps / 1000) + "G" : mbps + "M"; }
function cmpVer(a, b) {
  const pa = String(a || "").match(/\d+/g) || [], pb = String(b || "").match(/\d+/g) || [];
  for (let i = 0; i < Math.max(pa.length, pb.length, 3); i++) {
    const x = +(pa[i] || 0), y = +(pb[i] || 0);
    if (x !== y) return x < y ? -1 : 1;
  }
  return 0;
}
function majorMinor(v) { const m = String(v || "").match(/^(\d+)\.(\d+)/); return m ? m[1] + "." + m[2] : null; }

  if (!s) return null;
  const t = clean(s).trim();
  if (/^never$/i.test(t)) return null;
  const iso = t.match(/^(\d{4})-(\d\d)-(\d\d)/);
  if (iso) return new Date(Date.UTC(+iso[1], +iso[2] - 1, +iso[3]));
  const d = new Date(t + " UTC");

function isoDate(d) { return d ? d.toISOString().slice(0, 10) : null; }
function sortIfNames(a, b) {
  const ka = ifKey(a), kb = ifKey(b);
  for (let i = 0; i < Math.max(ka.length, kb.length); i++) {
    const x = ka[i], y = kb[i];
    if (x === y) continue;
    if (x === undefined) return -1;
    if (y === undefined) return 1;
    if (typeof x === "number" && typeof y === "number") return x - y;
    return String(x) < String(y) ? -1 : 1;

function ifKey(n) { return String(n).split(/(\d+)/).filter(Boolean).map(p => /^\d+$/.test(p) ? +p : p); }
PPU.util = { clean, toInt, fmtNum, fmtBps, fmtSpeed, cmpVer, majorMinor, parseDate, isoDate, sortIfNames, pct };

/* ============================ interface names ============================ */
const RE_ETH = /^ethernet(\d+)\/(\d+)(?:\.(\d+))?$/;
const RE_AE = /^ae(\d+)(?:\.(\d+))?$/;
const RE_LOGICAL = /^(?:vlan|loopback|tunnel)(?:\.(\d+))?$/;
const RE_HA_DED = /^(?:ha1-a|ha1-b|ha1|ha2|hsci|ha2-a|ha2-b|dedicated-ha\d|management)$/;
function isIfToken(s) { return RE_ETH.test(s) || RE_AE.test(s) || RE_LOGICAL.test(s); }
function parentOf(name) { const i = name.indexOf("."); return i < 0 ? name : name.slice(0, i); }
function suffixOf(name) { const i = name.indexOf("."); return i < 0 ? "" : name.slice(i); }
PPU.ifnames = { RE_ETH, RE_AE, RE_LOGICAL, isIfToken, parentOf, suffixOf };

/* ============================ CLI sections ============================ */
function splitCli(text) {
  const out = new Map();
  if (!text) return out;
  const lines = clean(text).split("\n");
  let cmd = null, buf = [];
  const flush = () => {
    if (cmd == null) return;
    if (!out.has(cmd)) out.set(cmd, []);
    out.get(cmd).push(buf.join("\n"));
  };
  for (const ln of lines) {
    const m = ln.match(/^> (\S.*?)\s*$/);
    if (m) { flush(); cmd = m[1].replace(/\s+/g, " ").trim(); buf = []; continue; }
    if (cmd != null) buf.push(ln);
  }
  flush();
  return out;
}
function section(map, cmd, which) {
  const key = cmd.replace(/\s+/g, " ").trim();
  const arr = map.get(key);
  if (!arr || !arr.length) return null;
  const nonEmpty = arr.filter(s => s.trim());
  if (!nonEmpty.length) return null;
  return which === "first" ? nonEmpty[0] : nonEmpty[nonEmpty.length - 1];
}
function kv(text) {
  const o = {};
  for (const ln of clean(text || "").split("\n")) {
    const m = ln.match(/^\s*([A-Za-z0-9][\w .\-\/()?]*?)\s*:\s*(.*?)\s*$/);
    if (m && !(m[1] in o)) o[m[1].trim().toLowerCase()] = m[2];
  }

}
PPU.cli = { splitCli, section, kv };

function parseSystemInfo(text) {
  const o = kv(text);
  if (!o.model && !o.hostname) return null;
  return {
    hostname: o.hostname || null, model: o.model || null, serial: o.serial || null,
    family: o.family || null, swVersion: o["sw-version"] || null, uptime: o.uptime || null,
    uptimeSec: parseUptime(o.uptime), multiVsys: /^on$/i.test(o["multi-vsys"] || ""),
    advancedRouting: /^on$/i.test(o["advanced-routing"] || ""),
    mgmtIp: o["ip-address"] || null, vmMode: o["vm-mode"] || null, vmCores: toInt(o["vm-cpu-count"] || o["vm-cores"]),
    vmMemGb: o["vm-memory"] && toInt(o["vm-memory"]) ? Math.round(toInt(o["vm-memory"]) / 1048576 * 10) / 10 : null, vmMem: o["vm-memory"] || o["vm-mem"] || null,
    vmLicense: o["vm-license"] || null, vmCapTier: o["vm-cap-tier"] || null, operationalMode: o["operational-mode"] || null,
    appVersion: o["app-version"] || null, threatVersion: o["threat-version"] || null,
    cloudMode: o["cloud-mode"] || null,
    time: o.time || null
  };
}
function isVmSystem(sys) { return !!sys && (/^vm$/i.test(sys.family || "") || /^(PA-)?VM(-\d+)?$/i.test(sys.model || "") || !!sys.vmMode); }
PPU.isVmSystem = isVmSystem;
// A VM-Series source has no catalog row of its own ("PA-VM"). Describe it from the license, vCPU and memory tier.
function vmSourceModel(sys, idx) {
  if (!isVmSystem(sys)) return null;
  const tierGb = sys.vmCapTier && (sys.vmCapTier.match(/(\d+(?:\.\d+)?)\s*GB/i) || [])[1];
  const memGb = tierGb ? +tierGb : sys.vmMemGb || null;
  let sessions = null;
  const rows = idx && idx.cat && idx.cat.vm_memory_tiers && idx.cat.vm_memory_tiers.rows;
  if (rows && memGb) { const r = rows.filter(x => x[0] <= memGb).pop(); if (r) sessions = r[1]; }
  return { model: sys.model || "PA-VM", form: "vm", family: "VM-Series", lifecycle: "current", vm_source: true, vcpu: sys.vmCores ? [sys.vmCores] : [], mem_gb: memGb, max_sessions: sessions,
    license: sys.vmLicense || null, hypervisor: sys.vmMode || null, note: "VM-Series source" + (sys.vmCores ? ", " + sys.vmCores + " vCPU" : "") + (memGb ? ", " + memGb + " GB memory tier" : "") + (sys.vmMode ? " on " + sys.vmMode : "") + ".", sources: [] };
}
PPU.vmSourceModel = vmSourceModel;
function parseUptime(s) {
  if (!s) return null;
  const m = String(s).match(/(?:(\d+)\s+days?,\s*)?(\d+):(\d+):(\d+)/);
  if (!m) return null;
  return (+(m[1] || 0)) * 86400 + (+m[2]) * 3600 + (+m[3]) * 60 + (+m[4]);
}
function parseLicenses(text, now) {
  const out = [];
  if (!text) return out;
  const blocks = clean(text).split(/License entry:/).slice(1);
  for (const b of blocks) {
    const o = kv(b);
    if (!o.feature) continue;
    const expires = o.expires || "";
    const expD = parseDate(expires);
    let expired = /^yes/i.test(o["expired?"] || "");
    if (!o["expired?"] && expD && now) expired = expD < now;
    out.push({ feature: o.feature, description: o.description || "", issued: o.issued || "", expires,
      expiresIso: isoDate(expD), never: /never/i.test(expires), expired });
  }

}
function vsysLicenseCount(lics) {
  let n = null;
  for (const l of lics || []) {
    if (/virtual\s*sys/i.test(l.feature + " " + l.description) && !l.expired) {
      const m = (l.feature + " " + l.description).match(/(\d+)/);
      if (m) n = Math.max(n || 0, +m[1]);
      else n = n || 0;
    }
  }
  return n;
}
function parseSessionInfo(text) {
  if (!text) return null;
  const o = kv(text);
  const r = {
    supported: toInt(o["number of sessions supported"]),
    allocated: toInt(o["number of allocated sessions"]),
    utilizationPct: toInt(o["session table utilization"]),
    createdSinceBoot: toInt(o["number of sessions created since bootup"]),
    pps: toInt(o["packet rate"]),
    kbps: toInt(o.throughput),
    cps: toInt(o["new connection establish rate"])
  };
  return (r.supported != null || r.allocated != null) ? r : null;
}
function parseInterfaceAll(text) {
  const res = { hardware: [], logical: [], aggregateGroups: null };
  if (!text) return res;
  const lines = clean(text).split("\n");
  let mode = null;
  for (const ln of lines) {
    if (/total configured hardware interfaces/i.test(ln)) { mode = "hw"; continue; }
    if (/total configured logical interfaces/i.test(ln)) { mode = "lg"; continue; }
    const ag = ln.match(/aggregation groups:\s*(\d+)/i);
    if (ag) { res.aggregateGroups = +ag[1]; mode = null; continue; }
    if (/^\s*(name\s+id|---)/.test(ln) || !ln.trim()) continue;
    if (mode === "hw") {
      const m = ln.match(/^(\S+)\s+(\d+)\s+(\S+)/);
      if (m) {
        const [sp, dup, st] = m[3].split("/");

      }
    } else if (mode === "lg") {
      const m = ln.match(/^(\S+)\s+(\d+)\s+(\d+)\s+(.*)$/);
      if (m) {
        const rest = m[4];
        const cols = rest.trim().split(/\s{2,}/);
        let zone = "", fwd = "", tag = "", addr = "";
        const fm = rest.match(/(vr:\S+|lr:\S+|vlan:\S+|vw:\S+|N\/A|ha|tap)/);
        if (fm) {
          fwd = fm[1];
          zone = rest.slice(0, fm.index).trim();
          const after = rest.slice(fm.index + fm[1].length).trim().split(/\s+/);
          tag = after[0] || ""; addr = after.slice(1).join(" ");
        } else { zone = cols[0] || ""; }
        res.logical.push({ name: m[1], id: +m[2], vsys: +m[3], zone, forwarding: fwd, tag, address: addr });
      }
    }
  }
  return res;
}
function parseInterfaceDetail(text) {
  if (!text) return null;
  const o = {};
  const t = clean(text);
  let m;

    const [sp, du, st] = m[1].split("/");

 const matchesOnly = !!(opts && opts.matchesOnly);\n  const win = matchesOnly ? {head:0, tail:0} : scanWindow(name, size);\n  const reader = stream.getReader();\n  const head = [];\n  let headLen = 0;\n  const tail = [];\n  let tailLen = 0;\n  const streamDec = new TextDecoder(\"utf-8\");\n  let lineBuf = \"\";\n  let lineNo = 0;\n  const matches = [];\n  function pushTail(u8){\n    tail.push(u8);\n    tailLen += u8.length;\n    while (tailLen > win.tail && tail.length){\n      const extra = tailLen - win.tail;\n      if (tail[0].length <= extra){ tailLen -= tail[0].length; tail.shift(); }\n      else { tail[0] = tail[0].subarray(extra); tailLen -= extra; }\n    }\n  }\n  while (true){\n    const {done, value} = await reader.read();\n    if (done) break;\n    checkCancel();\n    if (headLen < win.head){\n      const needB = win.head - headLen;\n      if (value.length <= needB){ head.push(value); headLen += value.length; }\n      else {\n        head.push(value.subarray(0, needB));\n        headLen += needB;\n        pushTail(value.subarray(needB));\n      }\n    } else {\n      pushTail(value);\n    }\n    const s = streamDec.decode(value, {stream:true});\n    lineBuf += s;\n    let i;\n    while ((i = lineBuf.indexOf(\"\\n\")) >= 0){\n      const line = lineBuf.slice(0, i);\n      lineBuf = lineBuf.slice(i + 1);\n      lineNo++;\n      if (line && ISSUE_RE.test(line) && matches.length < MAX_MATCH_LINES){\n        ISSUE_RE.lastIndex = 0;\n        matches.push(line.length > 400 ? line.slice(0, 400) : line);\n      }\n    }\n    if (lineBuf.length > 1048576) lineBuf = lineBuf.slice(-4096);\n  }\n  if (lineBuf){\n    lineNo++;\n    if (ISSUE_RE.test(lineBuf) && matches.length < MAX_MATCH_LINES){\n      matches.push(lineBuf.slice(0, 400));\n    }\n  }\n  const headText = dec.decode(concatU8(head));\n  const tailText = tailLen ? dec.decode(concatU8(tail)) : \"\";\n  const extra = matches.filter(m => !headText.includes(m) && !tailText.includes(m));\n  let text = headText;\n  const partial = size > headLen;\n  if (partial){\n    const omitted = Math.max(0, size - headLen - tailLen);\n    text += \"\\n\\n[\u2026 \" + fmtBytes(omitted) + \" omitted from the middle of this log; kept the start, matching issue lines, and the end \u2026]\\n\\n\";\n    if (extra.length) text += extra.join(\"\\n\") + \"\\n\\n\";\n    text += tailText;\n  }\n  return {text, partial, matchCount: matches.length, kept: headLen + tailLen, matches};\n}\n\nasync function drainStream(stream){\n  const reader = stream.getReader();\n  while (true){\n    const {done} = await reader.read();\n    if (done) break;\n    checkCancel();\n  }\n}\n\nasync function parseTarStream(readable, depth){\n  if (depth > 4) return;\n  const tar = makeTarReader(readable);\n  let longName = null, paxPath = null;\n  while (await tar.need(512)){\n    checkCancel();\n    const h = tar.shift(512);\n    if (h.every(b => !b)) break;\n    let name = tarStr(h, 0, 100);\n    const prefix = tarStr(h, 345, 500);\n    if (prefix) name = prefix + \"/\" + name;\n    const size = parseInt(tarStr(h, 124, 136) || \"0\", 8) || 0;\n    const type = String.fromCharCode(h[156] || 48);\n    const pad = Math.ceil(size / 512) * 512;\n    if (type === \"L\" || type === \"K\" || type === \"x\" || type === \"g\"){\n      if (!(await tar.need(pad))) break;\n      const data = size ? tar.shift(pad).subarray(0, size) : new Uint8Array();\n      if (type === \"L\" || type === \"K\") longName = dec.decode(data).replace(/\\0.*$/s,\"\");\n      else {\n        const txt = dec.decode(data);\n        const m = txt.match(/\\bpath=([^\\n]+)/);\n        if (m) paxPath = m[1].trim();\n      }\n      continue;\n    }\n    if (longName){ name = longName; longName = null; }\n    if (paxPath){ name = paxPath; paxPath = null; }\n    name = name.replace(/^\\.\\//,\"\").replace(/\\\\/g,\"/\");\n    if (type === \"5\"){\n      if (pad) await tar.discard(pad);\n      continue;\n    }\n    if (type !== \"0\" && type !== \"\\0\" && type != new Blob([u8]).stream().pipeThrough(new DecompressionStream(fmt));\n  return concatU8(await readAllChunks(s));\n}\n\nasync function unzipMem(u8){\n  const v = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);\n  let e = u8.length - 22;\n  while (e >= 0 && v.getUint32(e, true) !== 0x06054b50) e--;\n  if (e < 0) throw new Error(\"Not a valid zip file\");\n  let n = v.getUint16(e + 10, true), p = v.getUint32(e + 16, true);\n  const out = [];\n  for (let i = 0; i < n; i++){\n    const m = v.getUint16(p + 10, true);\n    const cs = v.getUint32(p + 20, true);\n    const fl = v.getUint16(p + 28, true);\n    const xl = v.getUint16(p + 30, true);\n    const cl = v.getUint16(p + 32, true);\n    const lo = v.getUint32(p + 42, true);\n    const name = dec.decode(u8.subarray(p + 46, p + 46 + fl));\n    p += 46 + fl + xl + cl;\n    if (name.endsWith(\"/\")) continue;\n    const ds = lo + 30 + v.getUint16(lo + 26, true) + v.getUint16(lo + 28, true);\n    const raw = u8.subarray(ds, ds + cs);\n    if (v.getUint16(lo + 6, true) & 1){\n      out.push({name, text:\"\", skip:\"password protected\", size:0, indexed:true});\n      continue;\n    }\n    let data;\n    if (m === 0) data = raw.slice();\n    else if (m === 8) data = await inflateRaw(raw, \"deflate-raw\");\n    else data = new Uint8Array();\n    out.push({name, data, size: data.length});\n  }\n  return out;\n}\n\nasync function unpackTsfFile(file){\n  inBytes = 0;\n  outBytes = 0;\n  filesIndexed = 0;\n  currentFile = file && file.name || \"\";\n  fileSize = file && file.size || 0;\n  peakHeap = 0;\n  let emitted = 0;\n  const before = () => (emitted = filesIndexed);\n  const head = new Uint8Array(await file.slice(0, 512).arrayBuffer());\n  // Re-read via File.slice(0) + stream so on-demand extract uses the same path.\n  const src = file.slice ? file.slice(0) : file;\n  if (looksGzip(head) || /\\.(tgz|tar\\.gz|gz)$/i.test(file.name || \"\")){\n    const stream = countInputStream(src.stream()).pipeThrough(new DecompressionStream(\"gzip\"));\n    before();\n    await parseTarStream(stream, 0);\n    if (filesIndexed === emitted && !extractFound){\n      const raw = await inflateRaw(new Uint8Array(await src.arrayBuffer()), \"gzip\");\n      if (looksTar(raw)){\n        await parseTarStream(new Blob([raw]).stream(), 0);\n      } else {\n        const n = (file.name || \"file\").replace(/\\.gz$/i,\"\");\n        const kind = classifyEntry(n, raw.length);\n        filesIndexed++;\n        if (kind.mode === \"index\") emitFile({name:n, text:\"\", size:raw.length, skip:kind.reason, core:!!kind.core, indexed:true});\n        else emitFile({name:n, text:dec.decode(raw.length > (kind.cap||TEXT_CAP) ? raw.subarray(raw.length-TEXT_TAIL) : raw), size:raw.length});\n      }\n    }\n  } else if (looksZip(head) || /\\.zip$/i.test(file.name || \"\")){\n    if (file.size > 256*1024*1024) throw new Error(\"This zip is too large to open in the browser. Use the original .tgz if you have it.\");\n    const u8 = new Uint8Array(await src.arrayBuffer());\n    inBytes = file.size;\n    const inner = await unzipMem(u8);\n    for (const e of inner){\n      filesIndexed++;\n      currentFile = e.name;\n      if (e.skip){ emitFile(e); continue; }\n      const ck = classifyEntry(e.name, e.size || (e.data && e.data.length) || 0);\n      if (ck.mode === \"index\") emitFile({name:e.name, text:\"\", size:e.size||0, skip:ck.reason, core:!!ck.core, indexed:true});\n      else if (ck.mode === \"nested-tgz\" && e.data){\n        try {\n          const raw = looksGzip(e.data) ? new Blob([e.data]).stream().pipeThrough(new DecompressionStream(\"gzip\")) : new Blob([e.data]).stream();\n          await parseTarStream(raw, 1);\n        } catch (err){\n          emitFile({name:e.name, text:\"\", size:e.size||0, skip:\"could not unpack nested archive: \" + err.message, indexed:true});\n        }\n      } else if (e.data){\n        const cap = ck.cap || TEXT_CAP;\n        const slice = e.data.length > cap ? e.data.subarray(Math.ma function ensureMap() {
  const A = ST.A, t = target();
  if (!A.config || !t) return;
  const srcIfs = PPU.sourceInterfaces(A);
  const missing = srcIfs.some(s => !(s.name in ST.map));
  if (missing) {
    const am = PPU.autoMap(srcIfs, targetPorts());
    for (const s of srcIfs) if (!(s.name in ST.map)) { ST.map[s.name] = am.map[s.name] || ""; ST.mapNotes[s.name] = am.notes[s.name] || ""; }
  }
  // HA dedicated ports
  const ded = new Set(t.dedicated_ha || []);
  for (const [link, port] of Object.entries(A.ha.ports || {})) {
    if (!port || /^ethernet/.test(port)) continue;
    if (!(port in ST.haPortMap)) {
      if (ded.has(port)) ST.haPortMap[port] = port;
      else {
        // suggest a free copper data port (set to type HA on conversion)
        const taken = new Set(Object.values(ST.map).concat(Object.values(ST.haPortMap)).filter(Boolean));
        const free = targetPorts().filter(p => !taken.has(p.name));
        const pick = free.find(p => /rj45|mgig|virtual/.test(p.media)) || free[0];
        ST.haPortMap[port] = pick ? pick.name : "";
      }
    }
  }
}

    if (!hp.vm) {
      const P = hp.power;
      if (P.optionalPerUnit) h += "<tr><td>" + esc(t.model) + " extra " + (P.tgt && P.tgt.kind === "adapter" ? "power adapter" : "power supply") + "</td><td>" + P.optionalPerUnit * hp.units + "</td><td>second supply for redundancy" + (hp.units === 2 ? ", 1 per firewall" : "") + "</td></tr>";
      h += "<tr><td>Power cords / feeds (" + esc(P.cordKind) + ")</td><td>" + (P.cords != null ? P.cords : "to be confirmed") + "</td><td>" + (P.psuPerUnit != null ? P.psuPerUnit + " per firewall" : "") + "</td></tr>";
      for (const g of hp.groups) {
        if (g.reuse && !g.qty) continue;
        const item = g.kind === "optic" ? g.form + " optic" + (g.reuse ? " (existing, reuse)" : "") : (g.use === "ha" ? "Ethernet cable, HA link" : g.form);
        h += "<tr><td>" + esc(item) + (g.kind === "optic" ? " — " + esc(g.type) : "") + "</td><td>" + g.qty + "</td><td>" + (g.use === "ha" ? "HA links" : "data ports") + (g.kind === "optic" && g.type === "Type to be chosen" ? " (confirm SR/LR or DAC before ordering)" : "") + "</td></tr>";
      }
    }
    h += "</table>";
    if (!hp.vm) {
      const P = hp.power;
      h += "<h3>Power</h3><ul><li>Old firewall: " + esc(P.src.fromTsf ? P.src.fromTsf.count + " power supply(ies) in the tech-support file" : P.src.redundant != null ? (P.src.redundant ? "redundant power" : "single power supply") + " (" + P.src.basis + ")" : "not in the file") + ".</li>" + P.notes.map(n => "<li>" + esc(n) + "</li>").join("") + "</ul>";
      const flagged = hp.ports.filter(r => r.flags.length);
      if (flagged.length) h += "<h3>Ports where speed or media changes</h3><table><tr><th>Old → new port</th><th>Call-out</th></tr>" + flagged.map(r => "<tr><td>" + esc(r.src + " → " + r.tgt) + "</td><td>" + r.flags.map(x => esc(x)).join("<br>") + "</td></tr>").join("") + "</table>";
      else if (hp.ports.length) h += "<p>No port changes speed or media. Existing optics and cables can be reused where the cage size allows.</p>";
      if (hp.ha.length) h += "<h3>HA cabling</h3><table><tr><th>Link</th><th>Old</th><th>New</th><th>Connect</th></tr>" + hp.ha.map(r => "<tr><td>" + esc(r.label) + "</td><td>" + esc(r.srcDesc) + "</td><td>" + esc(r.tgtDesc || "not chosen") + "</td><td>" + esc(r.cableText || "") + (r.flags.length ? "<br>" + r.flags.map(x => esc(x)).join("<br>") : "") + "</td></tr>").join("") + "</table>";
      h += "<ul>" + hp.notes.map(n => "<li>" + esc(n) + "</li>").join("") + "</ul>";
    }
    const LR = licReview();
    h += "<h2>Licenses to quote</h2><table><tr><th>Item</th><th>Qty</th><th>Note</th></tr>";
    for (const f2 of LR.finalItems) h += "<tr><td>" + esc(f2.name) + "</td><td>" + f2.qty + "</td><td>" + esc(f2.source === "carry" ? "kept; " + f2.note : f2.source === "required" ? "required; " + f2.note : f2.note) + "</td></tr>";
    h += "</table>";
    const added = LR.finalItems.filter(x => x.source === "add").map(x => x.name);
    if (added.length) h += "<p><b>Added at the customer's request:</b> " + added.map(esc).join(", ") + ".</p>";
    if (LR.dropped.length) h += "<p><b>Not included:</b> " + LR.dropped.map(d => esc(d.name) + (d.expired ? " (expired today)" : " (dropped on review)")).join(", ") + ".</p>";
    h += "<ul>" + LP.notes.map(n => "<li>" + esc(n) + "</li>").join("") + "</ul>";
  } else h += "<p>No target selected.</p>";
  h += readinessReportHtml();
  h += '<p class="meta">No prices are included. Specifications come from Palo Alto Networks datasheets and the end-of-life page (catalog data as of ' + esc(ST.catalog.data_as_of || "?") + ").</p>";
  return h;
}
const REPORT_CSS = "body{font:15px/1.45 system-ui,Segoe UI,Arial;color:#111;background:#fff;max-width:900px;margin:24px auto;padding:0 20px}h1{font-size:24px;margin:0}h2{font-size:19px;margin:22px 0 8px;border-bottom:2px solid #2f6fd6;padding-bottom:4px}h3{font-size:16px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:6px 8px;text-align:left;vertical-align:top}th{background:#f2f4f7;width:32%}.meta{color:#555;font-size:13px}@media print{body{margin:0}}";
function renderReport() {
  const html = reportHtml();
  $("#tab-report").innerHTML = '<div class="card"><div class="actions"><button type="button" class="primary" id="b-rhtml">⬇️ Export report (HTML)</button><button type="button" id="b-rprint">🖨️ Print / save as PDF</button><button type="button" id="b-runbook">📋 Export cutover runbook (Markdown)</button><button type="button" id="b-psave">💾 Save plan (JSON)</button><label class="btn">📂 Load plan<input type="file" id="b-pload" accept=".json,application/json" hidden></label><label class="btn"><input type="checkbox" id="r-hide"' + (ST.hideSerial ? " checked" : "") + '> Hide serial numbers</label></div><div id="rpt" class="rptbox"><p class="muted" id="plan-msg">The plan file has your choices only (target, ports, hardware, licenses, convert options). It never contains the admin password or hash. It has hostnames and IP addresses from your choices, so keep it with your project files, not in a public place.</p><iframe id="rframe" title="Report preview" style="width:100%;height:900px;border:1px solid var(--bd);border-radius:8px;background:#fff"></iframe></div></div>';
  const doc = "<!DOCTYPE html><html><head><meta charset=utf-8><meta name=color-scheme content=light><title>Firewall refresh summary</title><style>" + REPORT_CSS + "</style></head><body>" + html + "</body></html>";
  const fr = $("#rframe"); fr.srcdoc = doc;
  $("#b-rhtml").onclick = () => download(outName("_refresh-summary.html"), doc, "text/html");
  $("#b-runbook").onclick = () => download(outName("_cutover-runbook.md"), runbookText(), "text/markdown");
  $("#b-psave").onclick = savePlan;
  $("#b-pload").onchange = e => { const f2 = e.target.files[0]; if (f2) loadPlan(f2); };
  if (window.__planMsg) $("#plan-msg").textContent = window.__planMsg;
  $("#b-rprint").onclick = () => { try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (e) { window.print(); } };
  $("#r-hide").onchange = e => { ST.hideSerial = e.target.checked; renderReport(); renderCurrent(); };
  window.__ppuReportHtml = doc;
}
