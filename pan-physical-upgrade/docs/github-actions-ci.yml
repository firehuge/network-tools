# ---- the job (reference copy) ----
jobs:
  test-pan-physical-upgrade:
    needs: changes
    if: needs.changes.outputs.ppu == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pan-physical-upgrade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      # Rebuild the page from source and fail if the committed pan-physical-upgrade.html is stale.
      - run: npm run build
      - run: git diff --exit-code -- pan-physical-upgrade.html catalog/models.json
      # The tests drive the Google Chrome that ships on GitHub's ubuntu runners (CHROME_PATH overrides).
      - run: npm test
