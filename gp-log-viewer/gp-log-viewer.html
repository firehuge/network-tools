<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>GlobalProtect Log Viewer</title>

<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#5c6b7a;--bd:#d8dee4;--g:#1f9d55;--y:#d89b00;--r:#d64545;--b:#2f6fd6;--gb:#e7f6ee;--yb:#fff6dc;--rb:#fdeaea}
.dark{--bg:#12161c;--card:#1b222b;--tx:#e6edf3;--mu:#97a4b1;--bd:#2c3642;--gb:#15301f;--yb:#332a0d;--rb:#3a1a1a}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,Segoe UI,Arial;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--bd)}
header h1{font-size:22px;margin:0;flex:1}button,select,input{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
main{max-width:1300px;margin:auto;padding:20px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:18px}
#drop{border:3px dashed var(--b);text-align:center;padding:40px;font-size:20px;cursor:pointer}#drop.over{background:var(--gb)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.f{padding:10px 12px;border-radius:8px;background:var(--bg)}
.f b{display:block;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}.f span{font-size:18px;word-break:break-all}.nf{color:var(--mu);font-style:italic}
.status{font-size:20px;font-weight:600;padding:10px 14px;border-radius:8px;margin-bottom:12px}.s-g{background:var(--gb);color:var(--g)}.s-y{background:var(--yb);color:var(--y)}.s-r{background:var(--rb);color:var(--r)}
.issue{border-left:6px solid;border-radius:8px;padding:12px 14px;margin:10px 0;cursor:pointer;background:var(--bg)}.issue.r{border-color:var(--r)}.issue.y{border-color:var(--y)}.issue.g{border-color:var(--g)}
.issue h3{margin:0 0 4px;font-size:18px}.tip{color:var(--mu)}.cnt{float:right;font-size:13px;color:var(--mu)}
#log{font:13px/1.4 Consolas,monospace;max-height:600px;overflow:auto;border:1px solid var(--bd);border-radius:8px}
.row{display:grid;grid-template-columns:170px 140px 1fr;gap:8px;padding:2px 8px;border-bottom:1px solid var(--bd);white-space:pre-wrap;word-break:break-all}
.row.err{background:var(--rb)}.row.warn{background:var(--yb)}.row.hit{outline:3px solid var(--b)}.row .fn{color:var(--mu)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.ctl input{flex:1;min-width:200px}
@media print{header button,#drop,#logcard,.ctl{display:none!important}body{background:#fff}}
</style></head><body>
<header><h1>🛡️ GlobalProtect Log Viewer</h1><span class="tip">Files stay on this computer. Nothing is uploaded.</span>
<button onclick="document.body.classList.toggle('dark')">🌓 Dark/Light</button><button onclick="window.print()">🖨️ Report / PDF</button></header>
<main>
<div id="drop" class="card">📂 Drop the GlobalProtect log file here (.zip, .tgz, .tar.gz, .tar, .gz, .log, .txt)<br><small>or click to browse</small><input id="fi" type="file" multiple hidden></div>
<div id="out" hidden>
<div class="card"><div id="stat" class="status"></div><div class="grid" id="sum"></div><p class="tip" id="files"></p></div>
<div class="card"><h2 style="margin-top:0">Problems found</h2><div id="issues"></div></div>
<div class="card" id="logcard"><h2 style="margin-top:0">All log lines</h2><div class="ctl">
<select id="ff"><option value="">All files</option></select><select id="sf"><option value="">All severities</option><option value="err">Errors only</option><option value="warn">Errors + warnings</option></select>
<input id="q" placeholder="Search logs…"></div><div id="cn" class="tip"></div><div id="log"></div></div></div>
</main>

const $=s=>document.querySelector(s);const dec=new TextDecoder('utf-8');

const dr=$('#drop');dr.onclick=()=>$('#fi').click();$('#fi').onchange=e=>run(e.target.files);
dr.ondragover=e=>{e.preventDefault();dr.classList.add('over')};dr.ondragleave=()=>dr.classList.remove('over');dr.ondrop=e=>{e.preventDefault();dr.classList.remove('over');run(e.dataTransfer.files)};
async function run(fs){try{dr.textContent='⏳ Reading…';await load([...fs]);dr.innerHTML='📂 Loaded: '+[...fs].map(f=>f.name).join(', ')+' — drop another file to replace'}catch(e){dr.textContent='❌ Could not read this file: '+e.message}}
</script></body></html>
