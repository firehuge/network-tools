# Extends the default gitleaks rules. The only exception: obviously fake passwords in PAAT's and the Physical Upgrade
# Planner's unit tests (for example "pw-synthetic-1234", "synthetic-pass-123"). Everything else, including the rest of paat/, is scanned.
[extend]
useDefault = true

[[allowlists]]
description = "synthetic test passwords in unit tests"
targetRules = ["generic-api-key"]
paths = ['''^paat/tests/.*\.py$''', '''^pan-physical-upgrade/tests/test_core\.mjs$''']
