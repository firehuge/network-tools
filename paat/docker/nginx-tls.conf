# HTTPS front end for the PAAT container (docker compose -f docker-compose.yml -f docker-compose.tls.yml). Certificate: docker/tls/paat.crt + paat.key.
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/paat.crt;
    ssl_certificate_key /etc/nginx/tls/paat.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 200m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://paat:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900s;
    }
}
